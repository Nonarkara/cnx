name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs of the same branch on new commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + lint + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must satisfy vite's engines (^20.19.0 || >=22.12.0). The previous
        # 20.18.1 / 22.11.0 pair sat just under both floors, so vitest died
        # at startup with ERR_REQUIRE_ESM loading vitest.config.ts. Pin to
        # the oldest versions that actually work, not round numbers.
        node: ["20.19.0", "22.12.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          CNX_SKIP_DISK_LOAD: "1"
        run: npm test

  build:
    name: Cloudflare Worker build (Node 22)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          # Same floor as the test matrix — vite 7 requires >=22.12.0.
          node-version: "22.12.0"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build Cloudflare bundle
        env:
          NEXT_PUBLIC_PROVINCE: cnx
          NEXT_PUBLIC_SITE_URL: https://cnx.nonarkara.org
        run: |
          npm run build:cnx 2>&1 | tee /tmp/build.log
          test -f .open-next/worker.js && echo "build: OK worker.js exists"
