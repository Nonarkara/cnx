name: Relay standby

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only upstream connectivity probe
        type: choice
        options: [probe]
        default: probe

permissions:
  contents: read

concurrency:
  group: cnx-relay-standby
  cancel-in-progress: false

jobs:
  standby:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
      - name: Probe independent upstream access (no credentials or writes)
        run: node --experimental-strip-types scripts/relay-standby.mjs probe
