name: Relay standby

on:
  schedule:
    - cron: '7-57/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Probe is read-only; standby fills stale copies; drill pushes real current readings
        type: choice
        options: [probe, standby, drill]
        default: probe

permissions:
  contents: read

concurrency:
  group: cnx-relay-standby
  cancel-in-progress: false

jobs:
  standby:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
      - name: Probe independent upstream access (no credentials or writes)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        run: node --experimental-strip-types scripts/relay-standby.mjs probe
      - name: Maintain stale safety feeds or exercise takeover
        if: github.event_name == 'schedule' || inputs.mode != 'probe'
        env:
          CNX_FLIGHTS_RELAY_SECRET: ${{ secrets.CNX_FLIGHTS_RELAY_SECRET }}
          CNX_STANDBY_MODE: ${{ inputs.mode || 'standby' }}
        run: node --experimental-strip-types scripts/relay-standby.mjs "$CNX_STANDBY_MODE"
