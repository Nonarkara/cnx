<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">CNX: from Chiang Mai observations to an operations view</title>
<desc id="desc">Live public feeds pass through server-side data adapters and API routes. Baked geography is served separately. Both reach the Next.js dashboard. Local Node development and Cloudflare Workers deployment use different storage and environment configuration. Missing data must remain labelled.</desc>
