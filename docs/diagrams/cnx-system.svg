<text x="48" y="69" font-size="16" letter-spacing="3">CNX / CHIANG MAI OPERATIONS</text>
<text x="48" y="122" font-size="40" font-weight="700">A place. Its signals. A readable view.</text>
<text x="48" y="156" font-size="17">Source-grounded architecture • schematic, not a map or a live screenshot</text>
<rect x="48" y="204" width="312" height="163" fill="#182e46"/>
<g fill="#f4f1ea"><text x="70" y="238" font-size="14" letter-spacing="2">01 / OBSERVATIONS</text><text x="70" y="274" font-size="24" font-weight="700">Public feeds</text><text x="70" y="307" font-size="17">Air · water · fires · flights · news</text><text x="70" y="337" font-size="15">Availability, keys and quotas vary</text></g>
